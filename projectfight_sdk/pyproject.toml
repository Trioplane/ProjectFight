[project]
name = "projectfight-sdk"
version = "0.1.0"
description = "Beet plugin for making addons for ProjectFight (Minecraft Map)"
readme = "README.md"
authors = [
    { name = "Trplnr", email = "triopane30@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beet>=0.116.0",
    "bolt>=0.50.1",
    "mecha>=0.104.1",
]

[dependency-groups]
dev = [
    "ruff",
    "rich>=15.0.0"
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
